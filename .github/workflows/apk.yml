name: Compilar APK y AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm ci
      - name: Copiar el juego al proyecto Android
        run: npx cap sync android
      - name: Clave de subida a Google Play (si está configurada)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then echo "$UPLOAD_KEYSTORE_B64" | base64 -d > android/app/upload.jks; echo "Clave de subida lista"; else echo "Sin clave de subida: el AAB saldrá sin firmar"; fi
      - name: Compilar APK de pruebas y AAB para Google Play
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug bundleRelease --no-daemon
      - name: Renombrar
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk RollSiege.apk
          cp android/app/build/outputs/bundle/release/app-release.aab RollSiege-GooglePlay.aab
      - uses: actions/upload-artifact@v4
        with:
          name: RollSiege
          path: |
            RollSiege.apk
            RollSiege-GooglePlay.aab
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Roll Siege (compilación ${{ github.run_number }})
          files: |
            RollSiege.apk
            RollSiege-GooglePlay.aab
          make_latest: true
